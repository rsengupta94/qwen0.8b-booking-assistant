[project]
name = "qwen0-8b-booking-assistant"
version = "0.1.0"
description = "Appointment booking assistant for a fictional mental health clinic, run on a 0.8B Qwen model with prompting only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "llama-cpp-python>=0.3.35",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
